# Local stack: Postgres plus the app, limited to the memory a small Railway service gets.
#   cp .env.example .env    # then fill in GOOGLE_CLIENT_ID and TRACK17_API_KEY
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trackhub
      POSTGRES_USER: trackhub
      # Local-only database password; production uses Railway's generated one.
      POSTGRES_PASSWORD: trackhub-local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackhub -d trackhub"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGPASSWORD: trackhub-local
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

volumes:
  pgdata:
