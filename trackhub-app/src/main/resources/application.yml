# Configuration only. Secrets are NEVER written here: every secret is read from an environment
# variable (see .env.example). This file is safe to commit to a public repository.
spring:
  application:
    name: trackhub
  profiles:
    # Both halves run in one container in production to fit the $5 budget (ADR 0001).
    active: ${TRACKHUB_PROFILES:api,worker}
  threads:
    virtual:
      enabled: true
  # Railway's Postgres exposes PGHOST, PGPORT, PGDATABASE, PGUSER and PGPASSWORD; the defaults
  # match the local docker-compose database.
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:trackhub}
    username: ${PGUSER:trackhub}
    password: ${PGPASSWORD:}
    hikari:
      # Small pool: one instance, low traffic, and every connection costs memory on the $5 plan.
      maximum-pool-size: 5
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it (ADR 0011).
      ddl-auto: validate
    # No database access from controllers or JSON rendering: queries happen in the service layer,
    # where they are visible and tested, not lazily while a response is written.
    open-in-view: false
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

trackhub:
  google:
    # The OAuth client id that Google puts in the token's "aud" claim. For Android this is the
    # *web* client id passed to requestIdToken(), not the Android client id (ADR 0014).
    client-id: ${GOOGLE_CLIENT_ID:}
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  track17:
    base-url: https://api.17track.net/track/v2.4
    api-key: ${TRACK17_API_KEY:}
    timeout: 5s

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # Metrics are pushed, not scraped: Grafana Cloud's free tier takes OTLP, and nothing has to reach
  # into the container. Off unless OTLP_METRICS_URL is set (ADR 0006).
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 60s
        headers:
          Authorization: ${OTLP_AUTH_HEADER:}
  metrics:
    tags:
      application: trackhub
    distribution:
      # Lets Grafana compute p50/p95/p99 for request and carrier-call latency.
      percentiles-histogram:
        http.server.requests: true
        trackhub.carrier.calls: true

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema), including MDC fields such as requestId.
      # Set LOG_FORMAT to empty in .env for classic readable lines when running locally.
      console: ${LOG_FORMAT:ecs}
